name: Temporary PHP CS autofix

on: pull_request

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Apply Nextcloud coding standard
        run: composer cs:fix
      - name: Commit formatting
        run: |
          git config user.name "Vitor Mattos"
          git config user.email "1079143+vitormattos@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -s -m "style: apply Nextcloud coding standard"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
